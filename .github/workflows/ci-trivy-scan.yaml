name: ci-trivy-scan

on:
  push: 
    branches:
      - "main"
      - "v*"
    paths:
      - "KubeArmor/**"
      - "protobuf/**"
      - ".github/workflows/ci-trivy-scan.yaml"
      - "pkg/**"
      - "!STABLE-RELEASE"

  create:
    branches:
      - "v*"

permissions: read-all

jobs:
  build:
    name: Run trivy scan
    if: github.repository == 'kubearmor/kubearmor'
    runs-on: oracle-vm-16cpu-64gb-x86-64
    permissions:
      id-token: write
    timeout-minutes: 150
    outputs:
      vulnerable: ${{ steps.summary.outputs.vulnerable }}
      failed_components: ${{ steps.summary.outputs.failed_components }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'KubeArmor/go.mod'
      
      - name: Filter changed paths
        uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
        id: filter
        with:
          filters: |
            kubearmor:
              - "KubeArmor/**"
              - "protobuf/**"
            controller:
              - 'pkg/KubeArmorController/**'
            operator:
              - 'pkg/KubeArmorOperator/**'
      
      - name: Install the latest LLVM toolchain
        run: ./.github/workflows/install-llvm.sh

      - name: Compile libbpf
        run: ./.github/workflows/install-libbpf.sh

      - name: Install bpftool
        run: ./.github/workflows/install-bpftool.sh

      - name: Generate vmlinux.h
        run: make -C BPF kernel_headers
        working-directory: KubeArmor

      - name: Generate BPF files
        run: go generate ./...
        working-directory: KubeArmor

      - name: Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }      
  
      - name: Build KubeArmor images to Docker
        run: GITHUB_SHA=$GITHUB_SHA ./KubeArmor/build/build_kubearmor.sh
      
      - name: Build Kubearmor controller 
        if: steps.filter.outputs.controller == 'true'
        working-directory: ./pkg/KubeArmorController
        run: make docker-build

      - name: Build Kubearmor operator
        if: steps.filter.outputs.operator == 'true'
        working-directory: ./pkg/KubeArmorOperator
        run: make docker-build

      - name: Save images to tar for Trivy Scan
        run: |
          docker save -o kubearmor-init.tar kubearmor/kubearmor-init:latest
          docker save -o kubearmor.tar kubearmor/kubearmor:latest
          if [[ ${{ steps.filter.outputs.operator }} == 'true' ]]; then
            docker save -o kubearmor-operator.tar kubearmor/kubearmor-operator:latest
          fi
          if [[ ${{ steps.filter.outputs.controller }} == 'true' ]]; then
            docker save -o kubearmor-controller.tar kubearmor/kubearmor-controller:latest
          fi
          
      - name: Prepare Trivy report directory
        run: mkdir -p trivy-reports

      - name: Run Trivy vulnerability scanner on kubearmor-init
        id: scan_init
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: kubearmor-init.tar
          format: 'table'
          output: 'trivy-reports/kubearmor-init.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true 

      - name: Run Trivy vulnerability scanner on kubearmor
        id: scan_main
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: kubearmor.tar
          format: 'table'
          output: 'trivy-reports/kubearmor.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'   
        continue-on-error: true  

      - name: Run Trivy vulnerability scanner on kubearmor-controller
        if: steps.filter.outputs.controller == 'true'
        id: scan_controller
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: kubearmor-controller.tar
          format: 'table'
          output: 'trivy-reports/kubearmor-controller.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'   
        continue-on-error: true 

      - name: Run Trivy vulnerability scanner on kubearmor-operator
        if: steps.filter.outputs.operator == 'true'
        id: scan_operator
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: kubearmor-operator.tar
          format: 'table'
          output: 'trivy-reports/kubearmor-operator.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'   
        continue-on-error: true 


      - name: Summarize Trivy scan results
        id: summary
        env:
          TRIVY_COMPONENTS: |
            kubearmor-init|kubearmor/kubearmor-init:latest|${{ steps.scan_init.outcome }}|true
            kubearmor|kubearmor/kubearmor:latest|${{ steps.scan_main.outcome }}|true
            kubearmor-controller|kubearmor/kubearmor-controller:latest|${{ steps.scan_controller.outcome }}|${{ steps.filter.outputs.controller }}
            kubearmor-operator|kubearmor/kubearmor-operator:latest|${{ steps.scan_operator.outcome }}|${{ steps.filter.outputs.operator }}
        run: ./.github/workflows/trivy-summarize.sh

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-reports
          path: trivy-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if vulnerabilities were found
        if: steps.summary.outputs.vulnerable == 'true'
        env:
          FAILED_COMPONENTS: ${{ steps.summary.outputs.failed_components }}
        run: |
          echo "Trivy reported vulnerabilities in: $FAILED_COMPONENTS"
          exit 1

  report-vulnerabilities:
    name: Track Trivy findings
    needs: build
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.vulnerable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Trivy reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trivy-reports
          path: trivy-reports

      - name: Create or update the Trivy tracking issue
        run: ./.github/workflows/trivy-report-issue.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRIVY_ISSUE_TITLE: "[Trivy] Vulnerabilities detected in KubeArmor images on main"
          TRIVY_ARTIFACT_NAME: trivy-reports
          TRIVY_REPORT_DIR: trivy-reports
          TRIVY_LABELS: security,trivy
          TRIVY_SEVERITY: CRITICAL,HIGH
