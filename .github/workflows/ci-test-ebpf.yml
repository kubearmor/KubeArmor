name: ci-test-ebpf

on:
  workflow_call:

permissions: read-all

jobs:
  ebpf-tests:
    name: Test compile and load on Ubuntu 24.04 / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "KubeArmor/go.mod"

      - name: Install necessary dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential libelf-dev pkg-config net-tools linux-headers-$(uname -r) linux-tools-$(uname -r) libbpf-dev unzip protobuf-compiler

          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
      
      - name: Install the latest LLVM toolchain
        run: ./.github/workflows/install-llvm.sh

      - name: Compile libbpf
        run: ./.github/workflows/install-libbpf.sh

      - name: Install bpftool
        run: ./.github/workflows/install-bpftool.sh

      - name: Compile eBPF Bytecode
        working-directory: KubeArmor/BPF
        run: make

      - name: Generate Enforcer eBPF files
        run: go generate ./...
        working-directory: KubeArmor

      - name: Load System Monitor eBPF Bytecode
        working-directory: KubeArmor/monitor
        run: sudo -E go run ci_load.go
