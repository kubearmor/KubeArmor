name: ci-merge-coverage

on:
  workflow_run:
    workflows: ["KubeArmor CI"]
    types:
      - completed

permissions: {}

jobs:
  merge-coverage-files:
    name: Download and merge files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    # Only run when the triggering workflow succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout the commit that produced the coverage artifacts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Download coverage artifacts from the triggering CI run.
      # No artifacts may exist if matrix-tests was skipped.
      - name: Download k8s coverage files from the triggering CI run
        id: download-coverage
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: coverage.*
          path: KubeArmor/
          name_is_regexp: true
          if_no_artifact_found: warn

      # Collect coverage profiles recursively (artifacts are unpacked into per-artifact subdirectories).
      - name: Collect coverage profiles
        id: coverage-files
        if: ${{ steps.download-coverage.outputs.found_artifact == 'true' }}
        run: |
          files="$(find KubeArmor -type f -name 'coverage*.out' 2>/dev/null | sort | paste -sd, - || true)"
          if [[ -z "$files" ]]; then
            echo "::warning::The triggering CI run did not produce any coverage profile, skipping the Codecov upload."
          else
            echo "Coverage profiles to upload:"
            tr ',' '\n' <<< "$files"
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload merged coverage to Codecov
        if: ${{ steps.coverage-files.outputs.files != '' }}
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-files.outputs.files }}
          # Attribute the report to the commit, branch, and PR that produced the coverage.
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ github.event.workflow_run.pull_requests[0].number }}
          fail_ci_if_error: true
