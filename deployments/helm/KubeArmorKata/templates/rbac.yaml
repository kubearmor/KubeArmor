{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubearmor-kata.fullname" . }}
  labels:
    {{- include "kubearmor-kata.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.kubearmor.com"]
    resources:
      - kubearmorpolicies
      - kubearmorclusterpolicies
      - kubearmorhostpolicies
      - kubearmornetworkpolicies
    verbs: ["get", "list", "watch", "update", "delete"]
  - nonResourceURLs: ["/apis", "/apis/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubearmor-kata.fullname" . }}
  labels:
    {{- include "kubearmor-kata.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubearmor-kata.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubearmor-kata.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

