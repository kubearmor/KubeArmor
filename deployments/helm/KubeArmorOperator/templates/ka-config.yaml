{{- if .Values.autoDeploy }}
apiVersion: operator.kubearmor.com/v1
kind: KubeArmorConfig
metadata:
    annotations:
        "helm.sh/hook": post-install,post-upgrade
    labels:
        app.kubernetes.io/name: kubearmorconfig
        app.kubernetes.io/instance: kubearmorconfig-sample
        app.kubernetes.io/part-of: kubearmoroperator
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/created-by: kubearmoroperator
    name: kubearmor-default
    namespace: {{ .Release.Namespace }}
spec:
    {{- $config := omit .Values.kubearmorConfig "globalNodeSelector" "globalTolerations" }}
    {{- toYaml $config | nindent 4}}
    globalNodeSelector:
        {{- toYaml (.Values.kubearmorConfig.globalNodeSelector | default .Values.global.nodeSelector) | nindent 8 }}
    globalTolerations:
        {{- toYaml (.Values.kubearmorConfig.globalTolerations | default .Values.global.tolerations) | nindent 8 }}
{{- end}}