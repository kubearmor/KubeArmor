apiVersion: security.kubearmor.com/v1
kind: KubeArmorHostPolicy
metadata:
  name: hsp-block-win-process
spec:
  nodeSelector:
    matchLabels:
      kubearmor.io/hostname: "*"
  process:
    matchPaths:
      - path: C:/Windows/System32/calc.exe
  action: Block
  severity: 5
  message: "calc.exe blocked (after update)"
