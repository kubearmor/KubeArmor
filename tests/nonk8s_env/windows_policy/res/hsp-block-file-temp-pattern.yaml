apiVersion: security.kubearmor.com/v1
kind: KubeArmorHostPolicy
metadata:
  name: hsp-block-file-temp
spec:
  nodeSelector:
    matchLabels:
      kubearmor.io/hostname: "*"
  severity: 5
  tags:
    - host
    - filesystem
  message: "File access under C:/Temp blocked"
  action: Block
  file:
    matchPatterns:
      - pattern: C:/Temp/*
