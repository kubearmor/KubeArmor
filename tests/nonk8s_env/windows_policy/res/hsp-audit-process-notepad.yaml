apiVersion: security.kubearmor.com/v1
kind: KubeArmorHostPolicy
metadata:
  name: hsp-audit-notepad-exec
spec:
  nodeSelector:
    matchLabels:
      kubearmor.io/hostname: "*"
  process:
    matchPaths:
      - path: C:/Windows/System32/notepad.exe
  action: Audit
  severity: 5
  message: "notepad.exe execution audited by KubeArmor"
